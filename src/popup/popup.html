<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <title>Bison Time Checker</title>
  <link rel="stylesheet" href="../ui/brand.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="top">
    <img class="logo" src="../icons/bt-32.png" alt="BT" width="28" height="28">
    <nav class="days">
      <button class="btn quiet nav" id="prev" title="Попередній день" aria-label="Попередній день">‹</button>
      <span id="dayLabel">Сьогодні</span>
      <button class="btn quiet nav" id="next" title="Наступний день" aria-label="Наступний день">›</button>
    </nav>
    <div class="total">
      <div class="display" id="total">0 год 0 хв</div>
      <div class="sub">до звіту</div>
    </div>
    <button class="btn quiet gear" id="settings" title="Налаштування" aria-label="Налаштування"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </header>
  <main id="app"></main>
  <script type="module" src="popup.js"></script>
</body>
</html>
